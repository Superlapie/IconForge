name: contract-gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 unzip curl

      - name: Install and verify Godot
        run: |
          chmod +x scripts/godot-runtime
          echo "ICONFORGE_GODOT=$(./scripts/godot-runtime install)" >> "$GITHUB_ENV"

      - name: Run contract gate
        run: ./scripts/contract-gate

      - name: Upload CI artifacts on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: contract-gate-linux
          path: out/ci-artifacts/contract
          if-no-files-found: warn

  contract-windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Godot
        shell: bash
        run: |
          chmod +x scripts/godot-runtime
          echo "ICONFORGE_GODOT=$(./scripts/godot-runtime install)" >> "$GITHUB_ENV"

      - name: Run contract gate
        shell: bash
        run: ./scripts/contract-gate

  contract-macos:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Godot
        shell: bash
        run: |
          chmod +x scripts/godot-runtime
          echo "ICONFORGE_GODOT=$(./scripts/godot-runtime install)" >> "$GITHUB_ENV"

      - name: Run contract gate
        shell: bash
        run: ./scripts/contract-gate

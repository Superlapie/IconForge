name: quality-gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install display and Python
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libx11-6 libgl1 python3 unzip curl ripgrep

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d9acfc8fe86f7b93f4a1b5f1c47c # v4.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - name: Install and verify Godot
        run: |
          chmod +x scripts/godot-runtime
          ICONFORGE_GODOT="$(./scripts/godot-runtime install)"
          ./scripts/godot-runtime bootstrap
          ./scripts/godot-runtime verify
          echo "ICONFORGE_GODOT=$ICONFORGE_GODOT" >> "$GITHUB_ENV"

      - name: Run quality gate
        run: ./scripts/quality-gate

      - name: Upload CI artifacts on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quality-gate-artifacts
          path: out/ci-artifacts/quality-gate
          if-no-files-found: warn
